name: CD - Terraform EKS

# Trigger the workflow only when pushing to the main branch
# and only if files inside the 'terraform/' directory are modified
on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    
    # All 'run' commands will automatically execute inside this directory
    defaults:
      run:
        working-directory: ./terraform

    steps:
      # Step 1: Clone the repository code to the runner
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Authenticate with AWS using GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Step 3: Install the Terraform CLI on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 4: Initialize the Terraform working directory
      - name: Terraform Init
        run: terraform init

      # Step 5: Generate and show the execution plan
      - name: Terraform Plan
        run: terraform plan

      # Step 6: Apply the changes automatically without manual approval
      - name: Terraform Destroy
        run: terraform destroy -auto-approve